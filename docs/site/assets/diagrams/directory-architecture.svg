<svg id="directory-architecture" width="100%" viewBox="0 0 960 944" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NetScript directory architecture showing an external OIDC identity provider feeding plugin-auth and Principal into service authorization, alongside DirectoryPort and adapters querying read-only enterprise directories while the application binds identities to immutable DirectoryRef keys and evaluates bounded memberOfAny grants.">
  <style>
    #directory-architecture { font-family: var(--ns-font-sans, system-ui, -apple-system, sans-serif); }
    #directory-architecture .canvas-bg { fill: var(--ns-bg, #ffffff); }
    #directory-architecture .zone-warn { fill: var(--ns-warning-subtle, #fff7c2); stroke: var(--ns-warning-border, #f3d673); stroke-width: 1.5; }
    #directory-architecture .zone-neutral { fill: var(--ns-surface, #f6f6f6); stroke: var(--ns-border, #d9d9d9); stroke-width: 1.5; }
    #directory-architecture .zone-info { fill: var(--ns-info-subtle, #e6f4fe); stroke: var(--ns-info-border, #acd8fc); stroke-width: 1.5; }
    #directory-architecture .node-warn { fill: var(--ns-surface-raised, #ffffff); stroke: var(--ns-warning-border, #f3d673); stroke-width: 1.5; }
    #directory-architecture .node-neutral { fill: var(--ns-surface-raised, #ffffff); stroke: var(--ns-border-strong, #bbbbbb); stroke-width: 1.5; }
    #directory-architecture .node-success { fill: var(--ns-success-subtle, #e9f6e9); stroke: var(--ns-success-border, #b2ddb5); stroke-width: 1.5; }
    #directory-architecture .node-success-featured { fill: var(--ns-success-subtle, #e9f6e9); stroke: var(--ns-success, #46a758); stroke-width: 2; }
    #directory-architecture .node-success-planned { fill: var(--ns-surface-raised, #ffffff); stroke: var(--ns-success-border, #b2ddb5); stroke-width: 1.5; stroke-dasharray: 6 4; }
    #directory-architecture .node-info { fill: var(--ns-surface-raised, #ffffff); stroke: var(--ns-info-border, #acd8fc); stroke-width: 1.5; }
    #directory-architecture .node-info-planned { fill: var(--ns-surface-raised, #ffffff); stroke: var(--ns-info-border, #acd8fc); stroke-width: 1.5; stroke-dasharray: 6 4; }
    #directory-architecture .pill-bg { fill: var(--ns-surface, #f6f6f6); stroke: var(--ns-border, #d9d9d9); stroke-width: 1; }
    #directory-architecture .label-bg { fill: var(--ns-bg, #ffffff); }
    #directory-architecture .title-fg { fill: var(--ns-fg, #202020); font-size: 15.5px; font-weight: 600; }
    #directory-architecture .title-zone { fill: var(--ns-fg, #202020); font-size: 17px; font-weight: 700; }
    #directory-architecture .sub-fg { fill: var(--ns-muted-fg, #646464); font-size: 13px; font-weight: 400; }
    #directory-architecture .eyebrow-warn { fill: var(--ns-warning-text, #4f3422); font-size: 14px; font-weight: 600; }
    #directory-architecture .eyebrow-muted { fill: var(--ns-muted-fg, #646464); font-size: 14px; font-weight: 600; }
    #directory-architecture .eyebrow-success { fill: var(--ns-success-text, #2a7e3b); font-size: 14px; font-weight: 600; }
    #directory-architecture .eyebrow-info { fill: var(--ns-info-text, #113264); font-size: 14.5px; font-weight: 600; }
    #directory-architecture .note-fg { fill: var(--ns-fg, #202020); font-size: 13.5px; font-weight: 400; }
    #directory-architecture .note-info { fill: var(--ns-info-text, #113264); font-size: 13.5px; font-weight: 500; }
    #directory-architecture .pill-text { fill: var(--ns-muted-fg, #646464); font-size: 12px; font-weight: 500; }
    #directory-architecture .edge-warn { fill: none; stroke: var(--ns-warning, #ffc53d); stroke-width: 2; }
    #directory-architecture .edge-neutral { fill: none; stroke: var(--ns-muted-fg, #646464); stroke-width: 2; }
    #directory-architecture .edge-success { fill: none; stroke: var(--ns-success, #46a758); stroke-width: 2; }
    #directory-architecture .edge-info { fill: none; stroke: var(--ns-info, #0090ff); stroke-width: 2; }
    #directory-architecture .edge-info-dashed { fill: none; stroke: var(--ns-info, #0090ff); stroke-width: 2; stroke-dasharray: 6 4; }
    #directory-architecture .arrow-warn { fill: var(--ns-warning, #ffc53d); }
    #directory-architecture .arrow-neutral { fill: var(--ns-muted-fg, #646464); }
    #directory-architecture .arrow-success { fill: var(--ns-success, #46a758); }
    #directory-architecture .arrow-info { fill: var(--ns-info, #0090ff); }
  </style>
  <defs>
    <marker id="dir-arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrow-warn" /></marker>
    <marker id="dir-arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrow-neutral" /></marker>
    <marker id="dir-arrow-success" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrow-success" /></marker>
    <marker id="dir-arrow-info" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrow-info" /></marker>
  </defs>
  <rect x="0" y="0" width="960" height="944" class="canvas-bg" />
  <!-- Zone 1: External Identity Provider -->
  <rect x="16" y="16" width="928" height="108" rx="10" class="zone-warn" />
  <text x="34" y="40" class="eyebrow-warn">Identity provider</text>
  <rect x="34" y="50" width="330" height="58" rx="8" class="node-warn" />
  <text x="199" y="75" text-anchor="middle" class="title-fg">OIDC / OAuth sign-in</text>
  <text x="199" y="96" text-anchor="middle" class="sub-fg">Keycloak, Entra, Okta, WorkOS</text>
  <text x="388" y="74" class="note-fg">ID token: sub, plus optional directory immutableId claim</text>
  <text x="388" y="97" class="eyebrow-warn">authenticates only — no per-group role mappers</text>
  <!-- Zone 2: NetScript Framework -->
  <rect x="16" y="148" width="928" height="310" rx="10" class="zone-neutral" />
  <text x="926" y="176" text-anchor="end" class="title-zone">NetScript framework</text>
  <text x="34" y="190" class="eyebrow-muted">Authentication (existing)</text>
  <rect x="34" y="202" width="420" height="54" rx="8" class="node-neutral" />
  <text x="244" y="234" text-anchor="middle" class="title-fg">@netscript/plugin-auth: sign-in &amp; sessions</text>
  <rect x="34" y="284" width="420" height="54" rx="8" class="node-neutral" />
  <text x="244" y="316" text-anchor="middle" class="title-fg" font-family="var(--ns-font-mono, ui-monospace, monospace)">Principal { subject, roles, scopes }</text>
  <rect x="34" y="366" width="420" height="62" rx="8" class="node-neutral" />
  <text x="244" y="393" text-anchor="middle" class="title-fg">@netscript/service authz</text>
  <text x="244" y="414" text-anchor="middle" class="sub-fg">role &amp; scope guards (.withAuthn / .withAuthz)</text>
  <text x="498" y="190" class="eyebrow-success">Live directory queries (RFC #2664)</text>
  <rect x="498" y="202" width="428" height="54" rx="8" class="node-success-planned" />
  <text x="712" y="226" text-anchor="middle" class="title-fg">@netscript/plugin-directory</text>
  <text x="712" y="246" text-anchor="middle" class="sub-fg">multi-instance routing &amp; bounded cache · planned</text>
  <rect x="498" y="284" width="428" height="56" rx="8" class="node-success-featured" />
  <text x="712" y="308" text-anchor="middle" class="title-fg">DirectoryPort + conformance suite</text>
  <text x="712" y="328" text-anchor="middle" class="eyebrow-success" font-family="var(--ns-font-mono, ui-monospace, monospace)">@netscript/plugin-directory-core</text>
  <rect x="498" y="366" width="134" height="62" rx="8" class="node-success-planned" />
  <text x="565" y="393" text-anchor="middle" class="title-fg">directory-ldap</text>
  <text x="565" y="414" text-anchor="middle" class="sub-fg">AD / Samba · planned</text>
  <rect x="645" y="366" width="134" height="62" rx="8" class="node-success-planned" />
  <text x="712" y="393" text-anchor="middle" class="title-fg">directory-entra</text>
  <text x="712" y="414" text-anchor="middle" class="sub-fg">Graph · planned</text>
  <rect x="792" y="366" width="134" height="62" rx="8" class="node-success-planned" />
  <text x="859" y="393" text-anchor="middle" class="title-fg">directory-scim</text>
  <text x="859" y="414" text-anchor="middle" class="sub-fg">SCIM 2.0 · planned</text>
  <!-- Zone 3: Enterprise directories (read-only) -->
  <rect x="498" y="482" width="446" height="118" rx="10" class="zone-info" />
  <text x="721" y="507" text-anchor="middle" class="eyebrow-info">Enterprise directories (read-only)</text>
  <rect x="516" y="522" width="198" height="62" rx="8" class="node-info-planned" />
  <text x="615" y="549" text-anchor="middle" class="title-fg">Active Directory / Samba</text>
  <text x="615" y="570" text-anchor="middle" class="sub-fg">LDAPS / StartTLS, strict CA</text>
  <rect x="730" y="522" width="196" height="62" rx="8" class="node-info-planned" />
  <text x="828" y="549" text-anchor="middle" class="title-fg">Microsoft Entra ID</text>
  <text x="828" y="570" text-anchor="middle" class="sub-fg">Graph API · planned</text>
  <!-- Zone 4: Application (generic adopter) -->
  <rect x="16" y="624" width="928" height="258" rx="10" class="zone-info" />
  <text x="926" y="652" text-anchor="end" class="eyebrow-info">Your NetScript application</text>
  <rect x="34" y="704" width="264" height="68" rx="8" class="node-info" />
  <text x="166" y="733" text-anchor="middle" class="title-fg">Identity binding</text>
  <text x="166" y="756" text-anchor="middle" class="sub-fg" font-family="var(--ns-font-mono, ui-monospace, monospace)">(iss, sub) -&gt; DirectoryRef</text>
  <rect x="348" y="704" width="264" height="68" rx="8" class="node-info" />
  <text x="480" y="733" text-anchor="middle" class="title-fg">Grant evaluator</text>
  <text x="480" y="756" text-anchor="middle" class="sub-fg">which granted groups apply now?</text>
  <rect x="662" y="704" width="264" height="68" rx="8" class="node-info" />
  <text x="794" y="733" text-anchor="middle" class="title-fg">Grant store</text>
  <text x="794" y="756" text-anchor="middle" class="sub-fg" font-family="var(--ns-font-mono, ui-monospace, monospace)">group immutableId -&gt; role</text>
  <text x="34" y="804" class="note-fg">Fail-closed: disabled or expired accounts return [], and unreachable directories raise DirectoryUnavailable.</text>
  <text x="34" y="829" class="note-fg">Immutable keys: grants bind to (directoryInstance, immutableId) — never mutable UPNs or display names.</text>
  <text x="34" y="854" class="note-info">Explicit freshness: every memberOfAny call returns evaluatedAt and consistency { source, ageMs }.</text>
  <!-- Edges -->
  <path d="M 244 108 L 244 198" class="edge-warn" marker-end="url(#dir-arrow-warn)" />
  <path d="M 244 256 L 244 280" class="edge-neutral" marker-end="url(#dir-arrow-neutral)" />
  <path d="M 244 338 L 244 362" class="edge-neutral" marker-end="url(#dir-arrow-neutral)" />
  <path d="M 712 256 L 712 280" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 712 340 L 569 363" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 712 340 L 712 362" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 712 340 L 855 363" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 552 428 L 552 518" class="edge-info-dashed" marker-end="url(#dir-arrow-info)" />
  <path d="M 712 428 L 712 470 L 854 470 L 854 518" class="edge-info-dashed" marker-end="url(#dir-arrow-info)" />
  <path d="M 298 738 L 344 738" class="edge-info" marker-end="url(#dir-arrow-info)" />
  <path d="M 662 738 L 616 738" class="edge-info" marker-end="url(#dir-arrow-info)" />
  <path d="M 96 428 L 96 700" class="edge-neutral" marker-end="url(#dir-arrow-neutral)" />
  <rect x="104" y="528" width="66" height="24" rx="4" class="label-bg" />
  <text x="110" y="545" class="eyebrow-muted">subject</text>
  <path d="M 362 704 L 362 432" class="edge-info" marker-end="url(#dir-arrow-info)" />
  <rect x="242" y="528" width="112" height="24" rx="4" class="label-bg" />
  <text x="348" y="545" text-anchor="end" class="eyebrow-info">effective roles</text>
  <path d="M 476 704 L 476 312 L 494 312" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <rect x="364" y="568" width="106" height="24" rx="4" class="label-bg" />
  <text x="466" y="585" text-anchor="end" class="eyebrow-success" font-family="var(--ns-font-mono, ui-monospace, monospace)">memberOfAny</text>
  <!-- Bottom strip: reused NetScript seams -->
  <text x="16" y="922" class="sub-fg">NetScript seams</text>
  <rect x="142" y="902" width="104" height="26" rx="13" class="pill-bg" />
  <text x="194" y="920" text-anchor="middle" class="pill-text" font-family="var(--ns-font-mono, ui-monospace, monospace)">definePlugin</text>
  <rect x="254" y="902" width="114" height="26" rx="13" class="pill-bg" />
  <text x="311" y="920" text-anchor="middle" class="pill-text">runtime config</text>
  <rect x="376" y="902" width="112" height="26" rx="13" class="pill-bg" />
  <text x="432" y="920" text-anchor="middle" class="pill-text">typed errors</text>
  <rect x="496" y="902" width="98" height="26" rx="13" class="pill-bg" />
  <text x="545" y="920" text-anchor="middle" class="pill-text">DB schemas</text>
  <rect x="602" y="902" width="88" height="26" rx="13" class="pill-bg" />
  <text x="646" y="920" text-anchor="middle" class="pill-text">telemetry</text>
  <rect x="698" y="902" width="108" height="26" rx="13" class="pill-bg" />
  <text x="752" y="920" text-anchor="middle" class="pill-text">Aspire wiring</text>
  <rect x="814" y="902" width="130" height="26" rx="13" class="pill-bg" />
  <text x="879" y="920" text-anchor="middle" class="pill-text">health &amp; doctor</text>
</svg>
