<svg id="directory-architecture" width="100%" viewBox="0 0 960 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NetScript directory architecture showing an external OIDC identity provider feeding plugin-auth and Principal into service authorization, alongside DirectoryPort and adapters querying read-only enterprise directories while the application binds identities to immutable DirectoryRef keys and evaluates bounded memberOfAny grants.">
  <style>
    #directory-architecture {
      font-family: var(--ns-font-sans);
      background-color: transparent;
    }
    #directory-architecture .zone-warn {
      fill: var(--ns-warning-subtle);
      stroke: var(--ns-warning-border);
      stroke-width: 1.5;
    }
    #directory-architecture .zone-neutral {
      fill: var(--ns-surface);
      stroke: var(--ns-border);
      stroke-width: 1.5;
    }
    #directory-architecture .zone-info {
      fill: var(--ns-info-subtle);
      stroke: var(--ns-info-border);
      stroke-width: 1.5;
    }
    #directory-architecture .node-warn {
      fill: var(--ns-surface-raised);
      stroke: var(--ns-warning-border);
      stroke-width: 1.5;
    }
    #directory-architecture .node-neutral {
      fill: var(--ns-surface-raised);
      stroke: var(--ns-border-strong);
      stroke-width: 1.5;
    }
    #directory-architecture .node-success {
      fill: var(--ns-success-subtle);
      stroke: var(--ns-success-border);
      stroke-width: 1.5;
    }
    #directory-architecture .node-success-featured {
      fill: var(--ns-success-subtle);
      stroke: var(--ns-success);
      stroke-width: 2;
    }
    #directory-architecture .node-success-planned {
      fill: var(--ns-surface-raised);
      stroke: var(--ns-success-border);
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
    }
    #directory-architecture .node-info {
      fill: var(--ns-surface-raised);
      stroke: var(--ns-info-border);
      stroke-width: 1.5;
    }
    #directory-architecture .node-info-planned {
      fill: var(--ns-surface-raised);
      stroke: var(--ns-info-border);
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
    }
    #directory-architecture .pill-bg {
      fill: var(--ns-surface);
      stroke: var(--ns-border);
      stroke-width: 1;
    }
    #directory-architecture .label-bg {
      fill: var(--ns-bg);
    }
    #directory-architecture .title-fg {
      fill: var(--ns-fg);
      font-size: 14px;
      font-weight: 600;
    }
    #directory-architecture .title-zone {
      fill: var(--ns-fg);
      font-size: 15px;
      font-weight: 700;
    }
    #directory-architecture .sub-fg {
      fill: var(--ns-muted-fg);
      font-size: 12px;
      font-weight: 400;
    }
    #directory-architecture .eyebrow-warn {
      fill: var(--ns-warning-text);
      font-size: 12.5px;
      font-weight: 600;
    }
    #directory-architecture .eyebrow-muted {
      fill: var(--ns-muted-fg);
      font-size: 12.5px;
      font-weight: 600;
    }
    #directory-architecture .eyebrow-success {
      fill: var(--ns-success-text);
      font-size: 12.5px;
      font-weight: 600;
    }
    #directory-architecture .eyebrow-info {
      fill: var(--ns-info-text);
      font-size: 13px;
      font-weight: 600;
    }
    #directory-architecture .note-fg {
      fill: var(--ns-fg);
      font-size: 12.5px;
      font-weight: 400;
    }
    #directory-architecture .note-info {
      fill: var(--ns-info-text);
      font-size: 12.5px;
      font-weight: 500;
    }
    #directory-architecture .pill-text {
      fill: var(--ns-muted-fg);
      font-size: 11px;
      font-weight: 500;
    }
    #directory-architecture .edge-warn {
      fill: none;
      stroke: var(--ns-warning);
      stroke-width: 2;
    }
    #directory-architecture .edge-neutral {
      fill: none;
      stroke: var(--ns-muted-fg);
      stroke-width: 2;
    }
    #directory-architecture .edge-success {
      fill: none;
      stroke: var(--ns-success);
      stroke-width: 2;
    }
    #directory-architecture .edge-info {
      fill: none;
      stroke: var(--ns-info);
      stroke-width: 2;
    }
    #directory-architecture .edge-info-dashed {
      fill: none;
      stroke: var(--ns-info);
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
    #directory-architecture .arrow-warn {
      fill: var(--ns-warning);
    }
    #directory-architecture .arrow-neutral {
      fill: var(--ns-muted-fg);
    }
    #directory-architecture .arrow-success {
      fill: var(--ns-success);
    }
    #directory-architecture .arrow-info {
      fill: var(--ns-info);
    }
  </style>

  <defs>
    <marker id="dir-arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arrow-warn" />
    </marker>
    <marker id="dir-arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arrow-neutral" />
    </marker>
    <marker id="dir-arrow-success" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arrow-success" />
    </marker>
    <marker id="dir-arrow-info" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arrow-info" />
    </marker>
  </defs>

  <!-- Zone 1: External Identity Provider -->
  <rect x="16" y="16" width="928" height="104" rx="10" class="zone-warn" />
  <text x="34" y="38" class="eyebrow-warn">Identity provider</text>

  <rect x="34" y="48" width="330" height="56" rx="8" class="node-warn" />
  <text x="199" y="72" text-anchor="middle" class="title-fg">OIDC / OAuth sign-in</text>
  <text x="199" y="92" text-anchor="middle" class="sub-fg">Keycloak, Entra, Okta, WorkOS</text>

  <text x="388" y="71" class="note-fg">ID token: sub, plus optional directory immutableId claim</text>
  <text x="388" y="92" class="eyebrow-warn">authenticates only — no per-group role mappers</text>

  <!-- Zone 2: NetScript Framework -->
  <rect x="16" y="144" width="928" height="304" rx="10" class="zone-neutral" />
  <text x="926" y="170" text-anchor="end" class="title-zone">NetScript framework</text>

  <!-- Left column: Existing auth -->
  <text x="34" y="184" class="eyebrow-muted">Authentication (existing)</text>

  <rect x="34" y="196" width="420" height="52" rx="8" class="node-neutral" />
  <text x="244" y="227" text-anchor="middle" class="title-fg">@netscript/plugin-auth: sign-in &amp; sessions</text>

  <rect x="34" y="276" width="420" height="52" rx="8" class="node-neutral" />
  <text x="244" y="307" text-anchor="middle" class="title-fg" font-family="var(--ns-font-mono)">Principal { subject, roles, scopes }</text>

  <rect x="34" y="356" width="420" height="60" rx="8" class="node-neutral" />
  <text x="244" y="382" text-anchor="middle" class="title-fg">@netscript/service authz</text>
  <text x="244" y="402" text-anchor="middle" class="sub-fg">role &amp; scope guards (.withAuthn / .withAuthz)</text>

  <!-- Right column: Directory port & adapters -->
  <text x="498" y="184" class="eyebrow-success">Live directory queries (RFC #2664)</text>

  <rect x="498" y="196" width="428" height="52" rx="8" class="node-success-planned" />
  <text x="712" y="219" text-anchor="middle" class="title-fg">@netscript/plugin-directory</text>
  <text x="712" y="237" text-anchor="middle" class="sub-fg">multi-instance routing &amp; bounded cache · planned</text>

  <rect x="498" y="276" width="428" height="54" rx="8" class="node-success-featured" />
  <text x="712" y="299" text-anchor="middle" class="title-fg">DirectoryPort + conformance suite</text>
  <text x="712" y="318" text-anchor="middle" class="eyebrow-success" font-family="var(--ns-font-mono)">@netscript/plugin-directory-core</text>

  <!-- Adapter row -->
  <rect x="498" y="356" width="134" height="60" rx="8" class="node-success" />
  <text x="565" y="382" text-anchor="middle" class="title-fg">directory-ldap</text>
  <text x="565" y="402" text-anchor="middle" class="sub-fg">ldapts · AD / LDAP</text>

  <rect x="645" y="356" width="134" height="60" rx="8" class="node-success-planned" />
  <text x="712" y="382" text-anchor="middle" class="title-fg">directory-entra</text>
  <text x="712" y="402" text-anchor="middle" class="sub-fg">Graph · planned</text>

  <rect x="792" y="356" width="134" height="60" rx="8" class="node-success-planned" />
  <text x="859" y="382" text-anchor="middle" class="title-fg">directory-scim</text>
  <text x="859" y="402" text-anchor="middle" class="sub-fg">SCIM 2.0 · planned</text>

  <!-- Zone 3: Enterprise directories (read-only) -->
  <rect x="498" y="472" width="446" height="116" rx="10" class="zone-info" />
  <text x="702" y="496" text-anchor="middle" class="eyebrow-info">Enterprise directories (read-only)</text>

  <rect x="516" y="510" width="198" height="60" rx="8" class="node-info" />
  <text x="615" y="536" text-anchor="middle" class="title-fg">Active Directory / LDAP</text>
  <text x="615" y="556" text-anchor="middle" class="sub-fg">LDAPS / StartTLS, strict CA</text>

  <rect x="730" y="510" width="196" height="60" rx="8" class="node-info-planned" />
  <text x="828" y="536" text-anchor="middle" class="title-fg">Microsoft Entra ID</text>
  <text x="828" y="556" text-anchor="middle" class="sub-fg">Graph API · planned</text>

  <!-- Zone 4: Application (generic adopter) -->
  <rect x="16" y="612" width="928" height="252" rx="10" class="zone-info" />
  <text x="34" y="638" class="eyebrow-info">Your NetScript application</text>

  <rect x="34" y="692" width="264" height="66" rx="8" class="node-info" />
  <text x="166" y="720" text-anchor="middle" class="title-fg">Identity binding</text>
  <text x="166" y="741" text-anchor="middle" class="sub-fg" font-family="var(--ns-font-mono)">(iss, sub) -&gt; DirectoryRef</text>

  <rect x="348" y="692" width="264" height="66" rx="8" class="node-info" />
  <text x="480" y="720" text-anchor="middle" class="title-fg">Grant evaluator</text>
  <text x="480" y="741" text-anchor="middle" class="sub-fg">which granted groups apply now?</text>

  <rect x="662" y="692" width="264" height="66" rx="8" class="node-info" />
  <text x="794" y="720" text-anchor="middle" class="title-fg">Grant store</text>
  <text x="794" y="741" text-anchor="middle" class="sub-fg" font-family="var(--ns-font-mono)">group immutableId -&gt; role</text>

  <text x="34" y="790" class="note-fg">Fail-closed: disabled or expired accounts return [], and unreachable directories raise DirectoryUnavailable (503).</text>
  <text x="34" y="814" class="note-fg">Immutable keys: grants bind to (directoryInstance, immutableId) — never mutable UPNs or display names.</text>
  <text x="34" y="838" class="note-info">Explicit freshness: every memberOfAny call returns evaluatedAt and consistency { source, ageMs }.</text>

  <!-- Edges -->
  <!-- IdP -> plugin-auth -->
  <path d="M 244 104 L 244 192" class="edge-warn" marker-end="url(#dir-arrow-warn)" />

  <!-- Auth vertical flow -->
  <path d="M 244 248 L 244 272" class="edge-neutral" marker-end="url(#dir-arrow-neutral)" />
  <path d="M 244 328 L 244 352" class="edge-neutral" marker-end="url(#dir-arrow-neutral)" />

  <!-- Directory vertical & fan-out flow -->
  <path d="M 712 248 L 712 272" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 712 330 L 569 353" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 712 330 L 712 352" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <path d="M 712 330 L 855 353" class="edge-success" marker-end="url(#dir-arrow-success)" />

  <!-- Adapters -> Enterprise directories -->
  <path d="M 552 416 L 552 506" class="edge-info" marker-end="url(#dir-arrow-info)" />
  <path d="M 712 416 L 712 460 L 854 460 L 854 506" class="edge-info-dashed" marker-end="url(#dir-arrow-info)" />

  <!-- Application internal horizontal flow -->
  <path d="M 298 725 L 344 725" class="edge-info" marker-end="url(#dir-arrow-info)" />
  <path d="M 662 725 L 616 725" class="edge-info" marker-end="url(#dir-arrow-info)" />

  <!-- Cross-boundary edges -->
  <!-- subject: service authz -> Identity binding -->
  <path d="M 96 416 L 96 688" class="edge-neutral" marker-end="url(#dir-arrow-neutral)" />
  <rect x="104" y="516" width="60" height="22" rx="4" class="label-bg" />
  <text x="110" y="531" class="eyebrow-muted">subject</text>

  <!-- effective roles: Grant evaluator -> service authz -->
  <path d="M 362 692 L 362 420" class="edge-info" marker-end="url(#dir-arrow-info)" />
  <rect x="252" y="516" width="102" height="22" rx="4" class="label-bg" />
  <text x="350" y="531" text-anchor="end" class="eyebrow-info">effective roles</text>

  <!-- memberOfAny: Grant evaluator -> DirectoryPort -->
  <path d="M 476 692 L 476 303 L 494 303" class="edge-success" marker-end="url(#dir-arrow-success)" />
  <rect x="372" y="556" width="98" height="22" rx="4" class="label-bg" />
  <text x="466" y="571" text-anchor="end" class="eyebrow-success" font-family="var(--ns-font-mono)">memberOfAny</text>

  <!-- Bottom strip: reused NetScript seams -->
  <text x="16" y="901" class="sub-fg">NetScript seams reused</text>

  <rect x="164" y="883" width="96" height="24" rx="12" class="pill-bg" />
  <text x="212" y="899" text-anchor="middle" class="pill-text" font-family="var(--ns-font-mono)">definePlugin</text>

  <rect x="268" y="883" width="112" height="24" rx="12" class="pill-bg" />
  <text x="324" y="899" text-anchor="middle" class="pill-text">runtime config</text>

  <rect x="388" y="883" width="110" height="24" rx="12" class="pill-bg" />
  <text x="443" y="899" text-anchor="middle" class="pill-text" font-family="var(--ns-font-mono)">*_FILE secrets</text>

  <rect x="506" y="883" width="94" height="24" rx="12" class="pill-bg" />
  <text x="553" y="899" text-anchor="middle" class="pill-text">DB schemas</text>

  <rect x="608" y="883" width="84" height="24" rx="12" class="pill-bg" />
  <text x="650" y="899" text-anchor="middle" class="pill-text">telemetry</text>

  <rect x="700" y="883" width="104" height="24" rx="12" class="pill-bg" />
  <text x="752" y="899" text-anchor="middle" class="pill-text">Aspire wiring</text>

  <rect x="812" y="883" width="132" height="24" rx="12" class="pill-bg" />
  <text x="878" y="899" text-anchor="middle" class="pill-text">health &amp; doctor</text>
</svg>
