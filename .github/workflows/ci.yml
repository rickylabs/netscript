name: ci

# S2 full CI. Lanes over the existing `deno task`s:
#
#   - `check-test` — the lean, required S1 pre-merge gate: repo-wide `deno check`
#     + `deno test`. A lightweight Redis service makes the CAS/saga-store
#     integrations mandatory inside the repo-wide suite rather than silently
#     skipped or repeated as historical one-off gates.
#
#   - `quality` — the S2 full quality lane the original header reserved: lint,
#     fmt, scaffold-version guard, publish dry-run, and critical advisory audit.
#     Required on `main` by the active `main-branch-protection` repository
#     ruleset. A failure blocks only while that required-check rule remains in
#     force; keeping a gate inside a non-required job would not enforce it.
#
#   - `deps-report` — non-blocking dependency-freshness report (informational).
#
# Skip policy (#1152, see `.github/scripts/ci-classify-changes.ts`): the
# `classify` job emits the capability vector; `check-test` reads `needs_deno`
# and `quality` reads `needs_deno || needs_docs`. Both jobs still START and
# report SUCCESS (they are required checks) but short-circuit to a
# "skipped-by-policy" step when the diff cannot affect them — the same
# pattern as e2e-cli.yml's scaffold tiers, and the same FAIL-CLOSED rule: a
# skip requires `classify` to SUCCEED with an explicit `needs_*=false`; a
# failed classify forces a full run. Push events (no diff) always run in
# full. `ci:full` forces everything; the skip labels do NOT extend here.
# `close-gate` always runs on non-draft PRs. The informational `deps-report`
# runs only for release tags or an explicit `ci:full` PR.
# Draft PR pushes schedule no jobs. The full required-context set materializes
# on `ready_for_review` and every later non-draft PR event.
#
# Still out of scope here (deferred Phase-2 "repo process automation" umbrella):
# the toolchain-heavy CLI runtime e2e (`deno task e2e:cli` / scaffold.runtime,
# which spawns `aspire` + `docker` + `postgres`), OIDC publish (S3), and the
# label/Projects automation.

on:
  push:
    branches: [main, 'feat/package-quality']
    tags: ['v*']
  pull_request:
    branches: [main, 'feat/**', 'epic/**', 'canary/**']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Mirror structured acceptance evidence
        # Live-state invariant: the tool fetches labels/body/head at execution
        # time and skips itself (exit 0, stated reason) when status:ready-merge
        # is absent. Event payloads supply identifiers only — a re-run retains
        # the original event snapshot (#1169 stale-state class, observed on
        # PRs #1176-#1178, 2026-08-03). Guarded by a regression test in
        # check-close-gate_test.ts against frozen-payload label reads.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          deno run --allow-env --allow-net
          .llm/tools/validation/mirror-acceptance-evidence.ts
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --pretty

      - name: Referenced issue acceptance gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          deno run --allow-env --allow-net
          .llm/tools/validation/check-close-gate.ts
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --pretty

      - name: Answered review-thread gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          deno task agentic:review-threads --
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --pretty

  classify:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      needs_deno: ${{ steps.decide.outputs.needs_deno }}
      needs_docs: ${{ steps.decide.outputs.needs_docs }}
      needs_fresh_browser: ${{ steps.decide.outputs.needs_fresh_browser }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Self-check the classifier
        run: >-
          deno test --allow-read --allow-write --allow-env
          .github/scripts/ci-classify-changes.test.ts

      - name: Compute changed files (merge-base diff, rename-aware)
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # `--name-status -M` so renames/copies report BOTH sides — a
        # source->docs rename can never classify docs-only (see e2e-cli.yml).
        run: |
          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          git diff --name-status -M "$BASE_SHA...$HEAD_SHA" > "$diff_file"
          {
            echo "changed<<__EOF__"
            cat "$diff_file"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Extract root deno.json (base + head, tasks-only discrimination)
        id: rootcfg
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Missing/unreadable content classifies as `toolchain` (fail toward
        # running) — hence `|| true` on both sides.
        run: |
          {
            echo "base<<__CFG_EOF__"
            git show "$BASE_SHA:deno.json" 2>/dev/null || true
            echo "__CFG_EOF__"
            echo "head<<__CFG_EOF__"
            git show "$HEAD_SHA:deno.json" 2>/dev/null || true
            echo "__CFG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Decide run/skip
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_NAME_STATUS: ${{ steps.diff.outputs.changed }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ROOT_DENO_JSON_BASE: ${{ steps.rootcfg.outputs.base }}
          ROOT_DENO_JSON_HEAD: ${{ steps.rootcfg.outputs.head }}
        run: deno run --allow-read --allow-write --allow-env .github/scripts/ci-classify-changes.ts

  check-test:
    needs: classify
    # Required check: always starts and reports (see the skip-policy header).
    # FAIL-CLOSED: a failed classify forces RUN=true.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_deno == 'true' }}
      RUN_FRESH_BROWSER: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_fresh_browser == 'true' }}
      SKIP_REASON: ${{ needs.classify.outputs.reason }}
      NETSCRIPT_TEST_REDIS_URL: redis://127.0.0.1:6379
      REDIS_CONTAINER: netscript-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Skipped by policy
        if: env.RUN != 'true'
        # REASON contains raw changed-file names — never interpolate it into
        # shell source; pass via env and print with printf.
        run: |
          printf '::notice::check-test skipped by policy. %s\n' "$SKIP_REASON"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Record skipped check receipt
        if: env.RUN != 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate check-test-job --id check-test-policy
          --output .llm/tmp/gate-receipts/check-test/policy.json
          --skip-reason "${SKIP_REASON:-Classifier selected no affected check-test surface.}"

      - name: Install workspace dependencies
        if: env.RUN == 'true'
        run: deno install

      - name: Start required Redis integration service
        if: env.RUN == 'true'
        run: |
          docker run --detach --rm --name "$REDIS_CONTAINER" --publish 6379:6379 redis:7-alpine
          for attempt in $(seq 1 10); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$REDIS_CONTAINER"
          exit 1

      - name: Repo-wide check
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate check --id check-test-check
          --output .llm/tmp/gate-receipts/check-test/check.receipt.json
          --child-report .llm/tmp/gate-receipts/check-test/check.report.json --
          --output .llm/tmp/gate-receipts/check-test/check.report.json

      - name: Repo-wide test
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate test --id check-test-test
          --output .llm/tmp/gate-receipts/check-test/test.receipt.json
          --child-report .llm/tmp/gate-receipts/check-test/test.report.json --
          --report-output .llm/tmp/gate-receipts/check-test/test.report.json

      - name: Install managed-form browser test runtime
        if: env.RUN == 'true' && env.RUN_FRESH_BROWSER == 'true'
        run: |
          browser_runtime="${RUNNER_TEMP}/netscript-playwright-cli"
          npm install --prefix "$browser_runtime" @playwright/cli@0.1.17
          echo "$browser_runtime/node_modules/.bin" >> "$GITHUB_PATH"
          "$browser_runtime/node_modules/.bin/playwright" install --with-deps chromium

      - name: Managed form browser regression
        if: env.RUN == 'true' && env.RUN_FRESH_BROWSER == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-browser --id check-test-fresh-browser
          --cwd packages/fresh --output .llm/tmp/gate-receipts/check-test/fresh-browser.json

      - name: Stop required Redis integration service
        if: always() && env.RUN == 'true'
        run: |
          if docker inspect "$REDIS_CONTAINER" >/dev/null 2>&1; then
            docker stop "$REDIS_CONTAINER"
          fi

      - name: Upload check-test gate receipts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.workflow }}-${{ github.job }}-gate-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .llm/tmp/gate-receipts/check-test/*.json
          if-no-files-found: error

  quality:
    needs: classify
    # Required check: always starts and reports. Runs for toolchain-relevant
    # diffs AND docs diffs (fmt/docs-accuracy/taglines validate Markdown), so
    # the gate is `needs_deno || needs_docs`. FAIL-CLOSED on classify failure.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_deno == 'true' || needs.classify.outputs.needs_docs == 'true' }}
      RUN_DENO: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_deno == 'true' }}
      RUN_DOCS: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_docs == 'true' }}
      SKIP_REASON: ${{ needs.classify.outputs.reason }}
    steps:
      - name: Skipped by policy
        if: env.RUN != 'true'
        # REASON contains raw changed-file names — never interpolate it into
        # shell source; pass via env and print with printf.
        run: |
          printf '::notice::quality skipped by policy. %s\n' "$SKIP_REASON"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Record skipped quality receipt
        if: env.RUN != 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate quality-job --id quality-policy
          --output .llm/tmp/gate-receipts/quality/policy.json
          --skip-reason "${SKIP_REASON:-Classifier selected no affected quality surface.}"

      - name: Check docs site source format
        if: env.RUN_DOCS == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate docs-source-format --id quality-docs-format
          --cwd docs/site --output .llm/tmp/gate-receipts/quality/docs-format.json

      - name: Test docs site source-format checker
        if: env.RUN_DOCS == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate docs-source-format-test --id quality-docs-format-test
          --cwd docs/site --output .llm/tmp/gate-receipts/quality/docs-format-test.json

      - name: Install workspace dependencies
        if: env.RUN_DENO == 'true'
        run: deno install

      - name: Lint
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate lint --id quality-lint
          --output .llm/tmp/gate-receipts/quality/lint.receipt.json
          --child-report .llm/tmp/gate-receipts/quality/lint.report.json --
          --output .llm/tmp/gate-receipts/quality/lint.report.json

      - name: Format check
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fmt-check --id quality-fmt
          --output .llm/tmp/gate-receipts/quality/fmt.receipt.json
          --child-report .llm/tmp/gate-receipts/quality/fmt.report.json --
          --output .llm/tmp/gate-receipts/quality/fmt.report.json

      - name: JSR tagline length
        if: env.RUN_DOCS == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate docs-tagline --id quality-docs-tagline
          --output .llm/tmp/gate-receipts/quality/docs-tagline.json

      - name: Docs accuracy check
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate docs-accuracy --id quality-docs-accuracy
          --output .llm/tmp/gate-receipts/quality/docs-accuracy.json

      - name: JSDoc example import and fence integrity
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate jsdoc-example-compile
          --id quality-jsdoc-example-compile
          --output .llm/tmp/gate-receipts/quality/jsdoc-example-compile.json

      - name: Agent docs corpus freshness
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate agent-docs-prose --id quality-agent-docs-prose
          --output .llm/tmp/gate-receipts/quality/agent-docs-prose.json

      - name: Generated asset freshness
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate assets-barrel --id quality-assets-barrel
          --output .llm/tmp/gate-receipts/quality/assets-barrel.json

      - name: Publish asset freshness
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate publish-assets --id quality-publish-assets
          --output .llm/tmp/gate-receipts/quality/publish-assets.json

      - name: Emitted sample type-check
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate emitted-samples --id quality-emitted-samples
          --output .llm/tmp/gate-receipts/quality/emitted-samples.json

      - name: NetScript JSR emitted-specifier guard
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate netscript-jsr-specifiers --id quality-jsr-specifiers
          --output .llm/tmp/gate-receipts/quality/jsr-specifiers.json

      - name: Scaffold version guard (no preview pins)
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate scaffold-versions --id quality-scaffold-versions
          --output .llm/tmp/gate-receipts/quality/scaffold-versions.json

      - name: Aspire version parity (phase 1)
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate aspire-version-parity --id quality-aspire-version-parity
          --output .llm/tmp/gate-receipts/quality/aspire-version-parity.json

      - name: Publish dry-run (0 slow-types across all units)
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate publish-dry-run --id quality-publish-dry-run
          --output .llm/tmp/gate-receipts/quality/publish-dry-run.json

      - name: Critical advisory audit
        if: env.RUN_DENO == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate audit-critical --id quality-audit-critical
          --output .llm/tmp/gate-receipts/quality/audit-critical.json

      - name: Upload quality gate receipts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.workflow }}-${{ github.job }}-gate-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .llm/tmp/gate-receipts/quality/*.json
          if-no-files-found: error

  deps-report:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       contains(github.event.pull_request.labels.*.name, 'ci:full')) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Install workspace dependencies
        run: deno install

      - name: Dependency freshness (report-only)
        run: deno task deps:latest
        continue-on-error: true

  lane-visibility:
    name: core CI lane visibility
    needs: [close-gate, classify, check-test, quality, deps-report]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize core lane outcomes
        env:
          CLOSE_GATE_RESULT: ${{ needs.close-gate.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          NEEDS_DENO: ${{ needs.classify.outputs.needs_deno }}
          NEEDS_DOCS: ${{ needs.classify.outputs.needs_docs }}
          CHECK_TEST_RESULT: ${{ needs.check-test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPS_REPORT_RESULT: ${{ needs.deps-report.result }}
        run: |
          describe_core_lane() {
            selected="$1"
            result="$2"
            if [ "$CLASSIFY_RESULT" = "success" ] && [ "$selected" != "true" ]; then
              printf 'skipped by policy'
            elif [ "$result" = "skipped" ]; then
              printf 'not scheduled'
            else
              printf 'ran (%s)' "$result"
            fi
          }

          if [ "$NEEDS_DENO" = "true" ] || [ "$NEEDS_DOCS" = "true" ]; then
            quality_selected="true"
          else
            quality_selected="false"
          fi
          check_test_outcome="$(describe_core_lane "$NEEDS_DENO" "$CHECK_TEST_RESULT")"
          quality_outcome="$(describe_core_lane "$quality_selected" "$QUALITY_RESULT")"

          {
            echo "## Core CI lane visibility"
            echo
            echo "A successful required job can be a policy skip; this table uses classifier outputs to distinguish it from real execution."
            echo
            echo "| Lane | Outcome |"
            echo "| --- | --- |"
            printf '| `close-gate` | ran (%s) |\n' "$CLOSE_GATE_RESULT"
            printf '| `classify` | ran (%s) |\n' "$CLASSIFY_RESULT"
            printf '| `check-test` | %s |\n' "$check_test_outcome"
            printf '| `quality` | %s |\n' "$quality_outcome"
            if [ "$DEPS_REPORT_RESULT" = "skipped" ]; then
              echo '| `deps-report` | not scheduled (release / `ci:full` only) |'
            else
              printf '| `deps-report` | ran (%s) |\n' "$DEPS_REPORT_RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
