name: pr-metadata-gates

on:
  pull_request:
    branches: [main, 'feat/**', 'epic/**', 'canary/**']
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breaking-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Breaking change migration gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          deno run --allow-env --allow-net
          .llm/tools/validation/check-breaking-migration.ts
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
