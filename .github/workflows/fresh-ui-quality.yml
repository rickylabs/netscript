name: Fresh UI package quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/fresh-ui/**'
      - '!packages/fresh-ui/**/*.md'
      - '!packages/fresh-ui/**/*.mdx'
      - 'packages/*/deno.json'
      - 'packages/*/deno.jsonc'
      - 'packages/cli/e2e/deno.json'
      - 'packages/cli/e2e/deno.jsonc'
      - 'plugins/*/deno.json'
      - 'plugins/*/deno.jsonc'
      - 'deno.lock'
      - 'tools/fresh-ui-browser/**'
      - '.llm/tools/css/**'
      - 'packages/fresh/**'
      - 'packages/cli/src/kernel/assets/app/**'
      - 'packages/cli/src/kernel/assets/embedded.generated.ts'
      - 'packages/cli/src/kernel/assets/publish-assets.generated.ts'
      - '.llm/tools/run-deno-test.ts'
      - '.llm/tools/gates/catalog.ts'
      - '.github/workflows/fresh-ui-quality.yml'
      - '.llm/tools/run-deno-check.ts'
      - '.llm/tools/run-deno-lint.ts'
      - '.llm/tools/validation/fresh-ui-quality_test.ts'
      - 'deno.json'
      - '.github/scripts/ci-classify-changes.ts'
      - '.github/scripts/ci-classify-changes.test.ts'
  push:
    branches: [main]
    paths:
      - 'packages/fresh-ui/**'
      - '!packages/fresh-ui/**/*.md'
      - '!packages/fresh-ui/**/*.mdx'
      - 'packages/*/deno.json'
      - 'packages/*/deno.jsonc'
      - 'packages/cli/e2e/deno.json'
      - 'packages/cli/e2e/deno.jsonc'
      - 'plugins/*/deno.json'
      - 'plugins/*/deno.jsonc'
      - 'deno.lock'
      - 'tools/fresh-ui-browser/**'
      - '.llm/tools/css/**'
      - 'packages/fresh/**'
      - 'packages/cli/src/kernel/assets/app/**'
      - 'packages/cli/src/kernel/assets/embedded.generated.ts'
      - 'packages/cli/src/kernel/assets/publish-assets.generated.ts'
      - '.llm/tools/run-deno-test.ts'
      - '.llm/tools/gates/catalog.ts'
      - '.github/workflows/fresh-ui-quality.yml'
      - '.llm/tools/run-deno-check.ts'
      - '.llm/tools/run-deno-lint.ts'
      - '.llm/tools/validation/fresh-ui-quality_test.ts'
      - 'deno.json'
      - '.github/scripts/ci-classify-changes.ts'
      - '.github/scripts/ci-classify-changes.test.ts'

permissions:
  contents: read

jobs:
  classify:
    name: classify Fresh UI changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      diff_unavailable: ${{ steps.diff.outputs.diff_unavailable }}
      needs_fresh_ui: ${{ steps.decide.outputs.needs_fresh_ui }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Self-check the classifier
        run: >-
          deno test --allow-read --allow-write --allow-env
          .github/scripts/ci-classify-changes.test.ts
      - name: Compute changed files
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_NAME_STATUS_FILE: ${{ runner.temp }}/changed-name-status.txt
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if ! git diff --name-status -M "$BASE_SHA...$HEAD_SHA" > "$CHANGED_NAME_STATUS_FILE" 2> "$error_file"; then
            cat "$error_file" >&2
            echo "diff_unavailable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "diff_unavailable=false"
          } >> "$GITHUB_OUTPUT"
      - name: Extract root deno.json
        id: rootcfg
        if: github.event_name == 'pull_request' && steps.diff.outputs.diff_unavailable != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "base<<__CFG_EOF__"
            git show "$BASE_SHA:deno.json" 2>/dev/null || true
            echo "__CFG_EOF__"
            echo "head<<__CFG_EOF__"
            git show "$HEAD_SHA:deno.json" 2>/dev/null || true
            echo "__CFG_EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Decide run or skip
        id: decide
        if: github.event_name != 'pull_request' || steps.diff.outputs.diff_unavailable != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_NAME_STATUS_FILE: ${{ runner.temp }}/changed-name-status.txt
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ROOT_DENO_JSON_BASE: ${{ steps.rootcfg.outputs.base }}
          ROOT_DENO_JSON_HEAD: ${{ steps.rootcfg.outputs.head }}
        run: deno run --allow-read --allow-write --allow-env .github/scripts/ci-classify-changes.ts

  fresh-ui-quality:
    needs: classify
    if: >-
      !cancelled() && needs.classify.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_fresh_ui != 'false' }}
      SKIP_REASON: ${{ needs.classify.outputs.reason }}
    steps:
      - name: Skipped by policy
        if: env.RUN != 'true'
        run: printf '::notice::Fresh UI quality skipped by policy. %s\n' "$SKIP_REASON"
      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@v5

      - name: Setup Deno
        if: env.RUN == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'

      - name: Frozen package type-check
        if: env.RUN == 'true'
        shell: bash
        run: |
          if ! deno run --allow-read --allow-write --allow-run --allow-env \
            .llm/tools/gates/run-gate.ts --gate check --id fresh-ui-check \
            --cwd packages/fresh-ui \
            --output .llm/tmp/gate-receipts/fresh-ui/check.receipt.json \
            --child-report ../../.llm/tmp/gate-receipts/fresh-ui/check.report.json -- \
            --output ../../.llm/tmp/gate-receipts/fresh-ui/check.report.json; then
            printf '::error::Fresh UI private lock is stale. Review the dependency diff, then run deno task --cwd packages/fresh-ui lock:update and commit packages/fresh-ui/deno.lock.\n'
            exit 1
          fi

      - name: Package lint
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate lint --id fresh-ui-lint
          --cwd packages/fresh-ui
          --output .llm/tmp/gate-receipts/fresh-ui/lint.receipt.json
          --child-report ../../.llm/tmp/gate-receipts/fresh-ui/lint.report.json --
          --output ../../.llm/tmp/gate-receipts/fresh-ui/lint.report.json

      - name: Token schema, names and contrast
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-token-quality --id fresh-ui-token-quality
          --cwd packages/fresh-ui
          --output .llm/tmp/gate-receipts/fresh-ui/token-quality.json

      - name: Token artifact freshness
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-tokens --id fresh-ui-tokens
          --cwd packages/fresh-ui
          --output .llm/tmp/gate-receipts/fresh-ui/tokens.json

      - name: Fresh UI tests
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate test --id fresh-ui-tests
          --cwd packages/fresh-ui
          --output .llm/tmp/gate-receipts/fresh-ui/tests.receipt.json
          --child-report ../../.llm/tmp/gate-receipts/fresh-ui/tests.report.json --
          --report-output ../../.llm/tmp/gate-receipts/fresh-ui/tests.report.json

      - name: Frozen token build
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-token-build --id fresh-ui-token-build
          --cwd packages/fresh-ui
          --output .llm/tmp/gate-receipts/fresh-ui/token-build.json

      - name: Frozen-lock failure regression
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-lock-regression --id fresh-ui-lock-regression
          --output .llm/tmp/gate-receipts/fresh-ui/lock-regression.json

      - name: Clean worktree invariant
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate clean-worktree --id fresh-ui-clean-worktree
          --output .llm/tmp/gate-receipts/fresh-ui/clean-worktree.json

      - name: Upload Fresh UI gate receipts
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.workflow }}-${{ github.job }}-gate-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .llm/tmp/gate-receipts/fresh-ui/*.json
          if-no-files-found: error

  fresh-ui-browser:
    name: Fresh UI design browser evidence
    needs: classify
    if: >-
      !cancelled() && needs.classify.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUN: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_fresh_ui != 'false' }}
      SKIP_REASON: ${{ needs.classify.outputs.reason }}
    steps:
      - name: Skipped by policy
        if: env.RUN != 'true'
        run: printf '::notice::Fresh UI browser evidence skipped by policy. %s\n' "$SKIP_REASON"
      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@v5
      - name: Setup Deno
        if: env.RUN == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Setup Node
        if: env.RUN == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/fresh-ui-browser/package-lock.json
      - name: Install locked browser tooling
        if: env.RUN == 'true'
        working-directory: tools/fresh-ui-browser
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        if: env.RUN == 'true'
        working-directory: tools/fresh-ui-browser
        run: npx playwright install --with-deps chromium
      - name: CSS budget and rule comparator regressions
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-css-tests --id fresh-ui-css-tests
          --output .llm/tmp/gate-receipts/fresh-ui-browser/css-tests.receipt.json
      - name: Reproduce Utility CSS parity from committed inputs
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-css-parity --id fresh-ui-css-parity
          --output .llm/tmp/gate-receipts/fresh-ui-browser/css-parity.receipt.json
          --child-report .llm/tmp/css-parity/parity.json -- --output .llm/tmp/css-parity
      - name: Generate local-source gallery app
        if: env.RUN == 'true'
        run: >-
          deno run -A --frozen packages/cli/bin/netscript-dev.ts init fresh-ui-browser
          --path .llm/tmp/s0/scaffold --app-name dashboard --db none
          --no-aspire --no-git --editor none --ci --yes
      - name: Opt in to design preview styles
        if: env.RUN == 'true'
        run: >-
          deno run -A --frozen packages/cli/bin/netscript-dev.ts ui:add theme-previews
          --project-root .llm/tmp/s0/scaffold/fresh-ui-browser/apps/dashboard
      - name: Exact axe baseline contract
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-browser-contract --id fresh-ui-browser-contract
          --cwd tools/fresh-ui-browser
          --output .llm/tmp/gate-receipts/fresh-ui-browser/contract.receipt.json
          --child-report ../../.llm/tmp/gate-receipts/fresh-ui-browser/contract.report.json --
          --report-output ../../.llm/tmp/gate-receipts/fresh-ui-browser/contract.report.json
      - name: Screenshots, axe and keyboard matrix
        if: env.RUN == 'true'
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-browser --id fresh-ui-browser
          --cwd tools/fresh-ui-browser
          --output .llm/tmp/gate-receipts/fresh-ui-browser/browser.receipt.json
          --child-report test-results/results.json
      - name: Upload design screenshots and reports
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: fresh-ui-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/fresh-ui-browser/test-results/
            tools/fresh-ui-browser/playwright-report/
            .llm/tmp/gate-receipts/fresh-ui-browser/
            .llm/tmp/css-parity/
          if-no-files-found: error
          retention-days: 30
