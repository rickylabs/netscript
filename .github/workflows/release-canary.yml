name: release-canary
run-name: canary ${{ inputs.republish-version || inputs.target-version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target-version:
        description: Release version targeted by this canary, for example 0.0.2
        required: true
        type: string
      republish-version:
        description: Existing same-train canary to complete, for example 0.0.2-canary.3
        required: false
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

# Queue policy: one immutable registry version is a global entity across every
# branch, so the key intentionally stays version-keyed and branch-agnostic. A
# generation suffix would split that correctness mutex and allow two workflow
# generations to publish the same version concurrently.
#
# `cancel-in-progress: false` protects the RUNNING publish but, by itself,
# leaves only one PENDING slot; a third dispatch evicts that pending job, whose
# `cancelled` conclusion and zero executed steps identify queue eviction rather
# than mid-execution cancellation. Serialize all explicit maintainer requests;
# redundant later attempts fail closed at the existing registry/publish guards
# instead of silently replacing an earlier request.
concurrency:
  group: release-canary-${{ inputs.republish-version || inputs.target-version }}
  cancel-in-progress: false
  queue: max

jobs:
  publish-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Check JSR publish-attempt budget before minting
        if: inputs.republish-version == ''
        env:
          JSR_API_TOKEN: ${{ secrets.JSR_API_TOKEN }}
        run: deno run --allow-net=api.jsr.io --allow-read --allow-env=JSR_API_TOKEN .llm/tools/release/check-jsr-publish-budget.ts

      - name: Record content SHA and pending pair
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${source_sha}" \
            -f state=pending \
            -f context=release/canary-pair \
            -f description='Canary publish and pinned production E2E are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Cut ephemeral canary branch and tag
        id: cut
        if: inputs.republish-version == ''
        env:
          TARGET_VERSION: ${{ inputs.target-version }}
          CANARY_RESULT: ${{ runner.temp }}/canary-result.json
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          deno task release:canary -- "$TARGET_VERSION" --output "$CANARY_RESULT"
          version="$(jq -er '.version' "$CANARY_RESULT")"
          tag="$(jq -er '.tag' "$CANARY_RESULT")"
          branch="$(jq -er '.branch' "$CANARY_RESULT")"
          test -n "$version"
          test "$version" != "null"
          test -n "$tag"
          test "$tag" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Verify same-semver canary republish
        if: inputs.republish-version != ''
        env:
          TARGET_VERSION: ${{ inputs.target-version }}
          REPUBLISH_VERSION: ${{ inputs.republish-version }}
        run: deno task release:canary -- "$TARGET_VERSION" --republish-version "$REPUBLISH_VERSION"

      - name: Resolve canary context
        id: canary
        env:
          REPUBLISH_VERSION: ${{ inputs.republish-version }}
          CUT_VERSION: ${{ steps.cut.outputs.version }}
          CUT_TAG: ${{ steps.cut.outputs.tag }}
          CUT_BRANCH: ${{ steps.cut.outputs.branch }}
        run: |
          version="${REPUBLISH_VERSION:-$CUT_VERSION}"
          tag="${REPUBLISH_VERSION:+v$REPUBLISH_VERSION}"
          tag="${tag:-$CUT_TAG}"
          test -n "$version"
          test -n "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=${CUT_BRANCH:-}" >> "$GITHUB_OUTPUT"

      - name: Publish readiness
        run: deno task publish:readiness

      - name: Ensure JSR packages exist
        env:
          JSR_API_TOKEN: ${{ secrets.JSR_API_TOKEN }}
        run: deno run --allow-net --allow-read --allow-env .llm/tools/release/jsr-provision-packages.ts

      - name: Publish dry-run
        run: deno run --allow-read --allow-write --allow-run .llm/tools/release/run-publish.ts --dry-run

      - name: Publish preflight (real graph build, no upload)
        run: deno run --allow-read --allow-write --allow-run .llm/tools/release/run-publish.ts --preflight

      - name: Publish canary through the production path
        id: publish
        run: deno run --allow-read --allow-write --allow-run .llm/tools/release/run-publish.ts

      - name: Detect exact-version registry outcome after publish failure
        id: publish-outcome
        if: failure() && steps.publish.outcome == 'failure' && steps.canary.outputs.version != ''
        env:
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
          OUTCOME_FILE: ${{ runner.temp }}/publish-outcome.json
        run: |
          deno run --allow-net=jsr.io --allow-read .llm/tools/release/report-jsr-publish-outcome.ts \
            --version "$CANARY_VERSION" > "$OUTCOME_FILE"
          kind="$(jq -er '.kind' "$OUTCOME_FILE")"
          published="$(jq -er '.published | length' "$OUTCOME_FILE")"
          missing="$(jq -er '.missing | length' "$OUTCOME_FILE")"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          cat "$OUTCOME_FILE"

      - name: Label published canary payload and verify drift
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          deno task release:canary-label -- \
            --repo "$GITHUB_REPOSITORY" \
            --published-version "$CANARY_VERSION" \
            --head "$SOURCE_SHA"

      - name: Dispatch exact canary production E2E
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TAG: ${{ steps.canary.outputs.tag }}
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-cli-prod.yml/dispatches" \
            -f ref="$CANARY_TAG" \
            -F return_run_details=true \
            -f "inputs[published-version]=$CANARY_VERSION")"
          run_id="$(jq -er '.workflow_run_id' <<< "$response")"
          run_url="$(jq -er '.html_url' <<< "$response")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Await canary-pinned production E2E
        id: e2e
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$E2E_RUN_ID" --exit-status

      - name: Delete ephemeral canary branch
        id: cleanup
        if: always() && inputs.republish-version == '' && steps.canary.outputs.branch != ''
        continue-on-error: true
        env:
          CANARY_BRANCH: ${{ steps.canary.outputs.branch }}
        run: git push origin --delete "$CANARY_BRANCH"

      - name: Record green canary pair
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state=success \
            -f context=release/canary-pair \
            -f description="Canary ${VERSION} publish + pinned production E2E passed" \
            -f target_url="$RUN_URL"

      - name: Record failed canary pair
        if: failure() && steps.context.outputs.source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          if [[ "${{ steps.publish-outcome.outputs.kind }}" == "partial" ]]; then
            description="Canary partial publish: ${{ steps.publish-outcome.outputs.published }} live, ${{ steps.publish-outcome.outputs.missing }} missing"
          elif [[ "${{ steps.publish.outcome }}" == "success" && "${{ steps.e2e.outcome }}" == "failure" ]]; then
            description='Canary publish complete; pinned production E2E failed'
          else
            description='Canary publish failed before pinned production E2E'
          fi
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state=failure \
            -f context=release/canary-pair \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Write green-pair summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.canary.outputs.version }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          E2E_URL: ${{ steps.dispatch.outputs.run_url }}
          PUBLISH_OUTCOME: ${{ steps.publish-outcome.outputs.kind }}
          PUBLISHED_COUNT: ${{ steps.publish-outcome.outputs.published }}
          MISSING_COUNT: ${{ steps.publish-outcome.outputs.missing }}
        run: |
          {
            echo '## Canary green-pair verdict'
            echo
            echo "- Canary version: ${VERSION:-not-created}"
            echo "- Content SHA: ${SOURCE_SHA:-unknown}"
            echo "- Canary publish + pinned production E2E: ${JOB_STATUS}"
            echo "- Failed-publish registry outcome: ${PUBLISH_OUTCOME:-not-applicable}"
            echo "- Exact-version members after failure: ${PUBLISHED_COUNT:-unknown} live / ${MISSING_COUNT:-unknown} missing"
            echo "- Production E2E run: ${E2E_URL:-not-dispatched}"
            echo "- Ephemeral branch cleanup: ${{ steps.cleanup.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
