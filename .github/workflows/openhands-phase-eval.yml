name: OpenHands phase evaluation
run-name: Phase eval PR #${{ github.event.pull_request.number }} · ${{ github.event.action == 'ready_for_review' && 'impl-ready' || github.event.label.name }}

# Phase dispatcher. The generic OpenHands workflow remains the runner; this workflow owns the
# harness state machine and posts exactly one trusted trigger for each deliberate phase transition.
#
# Initial IMPL-EVAL: make a draft PR ready for review. `impl-eval:skip` is the attributed escape
# hatch. Rerun: move away from `status:impl-eval`, then add it again.
# PLAN-EVAL: add `openhands`, then add `status:plan-eval` (either label may complete the pair).
# Rerun by moving away from and back to `status:plan-eval`.

on:
  pull_request:
    types: [labeled, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: openhands-phase-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' &&
       ((github.event.label.name == 'status:plan-eval' &&
         contains(github.event.pull_request.labels.*.name, 'openhands')) ||
        (github.event.label.name == 'openhands' &&
         contains(github.event.pull_request.labels.*.name, 'status:plan-eval')) ||
        (github.event.pull_request.draft == false &&
         github.event.label.name == 'status:impl-eval')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SKIP_IMPL: ${{ github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'impl-eval:skip') }}
    steps:
      - name: Record attributed IMPL-EVAL skip
        if: env.SKIP_IMPL == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          {
            echo '## OpenHands phase evaluation'
            echo
            echo '**Status:** IMPL-EVAL skipped on demand'
            echo
            printf -- '- Who: `@%s`\n' "$REQUEST_ACTOR"
            echo '- Why: PR carries `impl-eval:skip`'
            printf -- '- PR: `#%s`\n' "$PR_NUMBER"
            printf -- '- Head SHA: `%s`\n' "$HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require chainable trigger token
        id: require_chainable_trigger_token
        if: env.SKIP_IMPL != 'true'
        env:
          CHAIN_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$CHAIN_TOKEN" ]; then
            echo 'PAT_TOKEN is required because GITHUB_TOKEN comments cannot trigger OpenHands.' >&2
            exit 1
          fi

      - name: Resolve protected base SHA for trusted evaluator code
        id: resolve_trusted_base
        if: >-
          !cancelled() &&
          env.SKIP_IMPL != 'true' &&
          steps.require_chainable_trigger_token.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const baseRef = await github.rest.git.getRef({
              owner: pr.base.repo.owner.login,
              repo: pr.base.repo.name,
              ref: `heads/${pr.base.ref}`,
            });
            const sha = baseRef.data.object.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error(`Protected base ref resolved to an invalid SHA: ${sha}`);
            }
            core.setOutput('sha', sha);

      - name: Check out trusted phase-eval scripts
        id: checkout_trusted_primitive
        if: >-
          !cancelled() &&
          env.SKIP_IMPL != 'true' &&
          steps.resolve_trusted_base.outcome == 'success'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ steps.resolve_trusted_base.outputs.sha }}
          path: .phase-eval-trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Enter IMPL-EVAL status on ready transition
        id: enter_impl_eval_status
        if: >-
          !cancelled() &&
          env.SKIP_IMPL != 'true' &&
          github.event.action == 'ready_for_review' &&
          steps.checkout_trusted_primitive.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          # This transition must use the same chainable token as dispatch. Repository Actions
          # policy may make GITHUB_TOKEN read-only even when workflow permissions request writes.
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const issue_number = context.payload.pull_request.number;
              const path = require('path');
              const { pathToFileURL } = require('url');
              const helperPath = path.join(
                process.env.GITHUB_WORKSPACE,
                '.phase-eval-trusted/.github/scripts/phase-eval-status.mjs',
              );
              const { applyImplEvalStatusTransition } = await import(
                pathToFileURL(helperPath).href
              );
              await applyImplEvalStatusTransition({
                listLabelsOnIssue: async () => {
                  const labels = await github.paginate(
                    github.rest.issues.listLabelsOnIssue,
                    { owner, repo, issue_number, per_page: 100 },
                  );
                  return labels.map(({ name }) => name);
                },
                removeLabel: async (name) => {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                },
                addLabels: async (labels) => {
                  await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
                },
              });
            } catch (error) {
              const reason = (error instanceof Error ? error.message : String(error))
                .replace(/[\r\n\0]+/g, ' ')
                .slice(0, 500);
              core.setOutput('failure_reason', reason);
              throw error;
            }

      - name: Record attributed IMPL-EVAL status-transition failure
        if: >-
          !cancelled() &&
          env.SKIP_IMPL != 'true' &&
          github.event.action == 'ready_for_review' &&
          steps.enter_impl_eval_status.outcome == 'failure'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_ACTOR: ${{ github.actor }}
          FAILURE_REASON: ${{ steps.enter_impl_eval_status.outputs.failure_reason }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const body = [
              '## OpenHands phase evaluation',
              '',
              '**Status:** IMPL-EVAL status transition failed; evaluator dispatch blocked',
              '',
              `- Who: \`@${process.env.REQUEST_ACTOR}\``,
              `- PR: \`#${process.env.PR_NUMBER}\``,
              `- Head SHA: \`${process.env.HEAD_SHA}\``,
              `- Reason: \`${process.env.FAILURE_REASON || 'unknown'}\``,
            ].join('\n');
            await core.summary.addRaw(body).write();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Resolve and dispatch exactly one evaluator
        if: >-
          !cancelled() &&
          env.SKIP_IMPL != 'true' &&
          steps.checkout_trusted_primitive.outcome == 'success' &&
          (github.event.action != 'ready_for_review' ||
           steps.enter_impl_eval_status.outcome == 'success')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TRUSTED_BASE_SHA: ${{ steps.resolve_trusted_base.outputs.sha }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventPr = context.payload.pull_request;
            const path = require('path');
            const { pathToFileURL } = require('url');
            const primitivePath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.phase-eval-trusted/.github/scripts/phase-eval-claim.mjs',
            );
            const { dispatchClaimedPhaseEvaluation, phaseEvalMarker } = await import(
              pathToFileURL(primitivePath).href
            );
            const statusPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.phase-eval-trusted/.github/scripts/phase-eval-status.mjs',
            );
            const { decidePhaseEvaluationCurrency } = await import(
              pathToFileURL(statusPath).href
            );
            const eventLabel = context.payload.label?.name ?? '';
            const phase = context.payload.action === 'ready_for_review' ||
                eventLabel === 'status:impl-eval' ||
                (eventLabel === 'openhands' &&
                 eventPr.labels.some((label) => label.name === 'status:impl-eval'))
              ? 'impl'
              : 'plan';

            const modelLabels = new Map([
              ['eval:model:minimax', 'openrouter/minimax/minimax-m3'],
              ['eval:model:deepseek', 'openrouter/deepseek/deepseek-v4-flash-0731'],
              ['eval:model:qwen', 'openrouter/qwen/qwen3.8-max'],
            ]);
            const promptPath = `.llm/tools/agentic/openhands/${phase}-eval-prompt.md`;
            const baseOwner = eventPr.base.repo.owner.login;
            const baseRepo = eventPr.base.repo.name;
            const trustedBaseSha = process.env.TRUSTED_BASE_SHA ?? '';
            if (!/^[0-9a-f]{40}$/.test(trustedBaseSha)) {
              throw new Error(`Protected base ref resolved to an invalid SHA: ${trustedBaseSha}`);
            }
            const promptResponse = await github.rest.repos.getContent({
              owner: baseOwner,
              repo: baseRepo,
              path: promptPath,
              ref: trustedBaseSha,
            });
            if (Array.isArray(promptResponse.data) || promptResponse.data.type !== 'file') {
              throw new Error(`Expected trusted evaluator prompt at ${promptPath}`);
            }
            const prompt = Buffer.from(promptResponse.data.content, 'base64').toString('utf8').trim();
            if (!prompt.startsWith('use harness\n')) {
              throw new Error(`${promptPath} must begin with "use harness"`);
            }

            const expectedStatus = phase === 'plan' ? 'status:plan-eval' : 'status:impl-eval';
            // Currency is checked from live GitHub state immediately before the immutable claim.
            // A queued stale event returns without a trigger comment, provider run, or model spend.
            const { data: livePr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: eventPr.number,
            });
            const liveLabelData = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              { owner, repo, issue_number: eventPr.number, per_page: 100 },
            );
            const labels = new Set(liveLabelData.map(({ name }) => name));
            const currency = decidePhaseEvaluationCurrency({
              eventHead: eventPr.head.sha,
              liveHead: livePr.head.sha,
              expectedStatus,
              liveLabels: [...labels],
            });
            if (!currency.dispatch) {
              core.notice(`Zero-spend stale evaluator event: ${currency.reason}. ${currency.recovery}`);
              await core.summary
                .addHeading('OpenHands phase evaluation')
                .addRaw('No evaluator was claimed or dispatched.\n')
                .addList([
                  `Phase: ${phase}`,
                  `PR: #${eventPr.number}`,
                  `Reason: ${currency.reason}`,
                  `Recovery: ${currency.recovery}`,
                ])
                .write();
              return;
            }
            const selectedLabels = [...labels].filter((label) => label.startsWith('eval:model:'));
            const unknown = selectedLabels.filter((label) => !modelLabels.has(label));
            if (unknown.length) throw new Error(`Unknown evaluator model label(s): ${unknown.join(', ')}`);
            if (selectedLabels.length > 1) {
              throw new Error(`Evaluator model labels are mutually exclusive: ${selectedLabels.join(', ')}`);
            }
            const selectedLabel = selectedLabels[0] ?? '';
            const model = selectedLabel
              ? modelLabels.get(selectedLabel)
              : phase === 'plan'
              ? 'openrouter/minimax/minimax-m3'
              : 'openrouter/deepseek/deepseek-v4-flash-0731';
            let generationEvent;
            for (let attempt = 0; attempt < 5 && !generationEvent; attempt += 1) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner,
                repo,
                issue_number: livePr.number,
                per_page: 100,
              });
              generationEvent = events
                .filter((event) => event.event === 'labeled' && event.label?.name === expectedStatus)
                .at(-1);
              if (!generationEvent) await new Promise((resolve) => setTimeout(resolve, 1000));
            }
            if (!generationEvent) {
              throw new Error(`No labeled-event generation found for ${expectedStatus}.`);
            }
            const claimKey = { generation: generationEvent.id, phase, head: livePr.head.sha };
            const marker = phaseEvalMarker(claimKey);
            const iterations = phase === 'plan' ? 500 : 800;
            const trigger = `@openhands-agent model=${model} output=pr-comment iterations=${iterations} phase=${phase} head=${livePr.head.sha}`;
            const findExistingTrigger = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: livePr.number,
                per_page: 100,
              });
              return comments.find((comment) =>
                String(comment.body ?? '').split(/\r?\n/).includes(marker)
              ) ?? null;
            };
            // Once trigger creation is attempted, an API failure may mean the comment succeeded
            // but its response was lost. The tested lifecycle rechecks the marker and retains the
            // claim if the result remains unknown. Cycle the phase status to recover with a new
            // generation; never re-run the failed job against the same claim.
            const outcome = await dispatchClaimedPhaseEvaluation(
              {
                createRef: async ({ ref, sha }) => {
                  await github.rest.git.createRef({ owner, repo, ref, sha });
                },
                getRef: async ({ ref }) => {
                  const existing = await github.rest.git.getRef({ owner, repo, ref });
                  return { sha: existing.data.object.sha };
                },
              },
              claimKey,
              async () => {
                const { data } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: livePr.number,
                  body: `${trigger}\n${marker}\n\nTrusted base SHA: ${trustedBaseSha}\nEvaluated head SHA: ${livePr.head.sha}\n\n${prompt}`,
                });
                return data;
              },
              findExistingTrigger,
            );
            if (!outcome.claimed) {
              core.notice(`This phase transition is already claimed by ${outcome.ref}.`);
              return;
            }
            const comment = outcome.trigger;
            if (selectedLabel) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: livePr.number,
                name: selectedLabel,
              });
            }
            await core.summary
              .addHeading('OpenHands phase evaluation')
              .addRaw('Claimed one deliberate evaluator transition.\n')
              .addList([
                `Phase: ${phase}`,
                `Model: ${model}`,
                `PR: #${livePr.number}`,
                `Head SHA: ${livePr.head.sha}`,
                `Generation: ${generationEvent.id}`,
                `Consumed override: ${selectedLabel || 'none'}`,
                `Trigger: ${comment.html_url}`,
              ])
              .write();

      - name: Fail closed on IMPL-EVAL status-transition failure
        if: >-
          !cancelled() &&
          env.SKIP_IMPL != 'true' &&
          github.event.action == 'ready_for_review' &&
          steps.enter_impl_eval_status.outcome == 'failure'
        run: |
          echo 'Evaluator dispatch was blocked because the required status transition failed.' >&2
          exit 1
