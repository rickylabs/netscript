name: Figma component library

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/figma-component-library/**'
      - 'packages/fresh-ui/**'
      - '.llm/tools/gates/**'
      - '.llm/tools/run-deno-*.ts'
      - '.github/workflows/figma-component-library.yml'
      - 'deno.json'
      - 'deno.lock'
  push:
    branches: [main]
    paths:
      - 'tools/figma-component-library/**'
      - 'packages/fresh-ui/**'
      - '.llm/tools/gates/**'
      - '.llm/tools/run-deno-*.ts'
      - '.github/workflows/figma-component-library.yml'
      - 'deno.json'
      - 'deno.lock'

permissions:
  contents: read

jobs:
  figma-component-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Validate pipeline, current contracts and isolated browser/native bundles
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate figma-component-library
          --id figma-component-library-ci
          --output .llm/tmp/gate-receipts/figma-component-library/ci.receipt.json
          --child-report .llm/tmp/gate-receipts/figma-component-library/ci.report.json --
          --report .llm/tmp/gate-receipts/figma-component-library/ci.report.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: figma-component-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: .llm/tmp/gate-receipts/figma-component-library/*.json
          if-no-files-found: error
