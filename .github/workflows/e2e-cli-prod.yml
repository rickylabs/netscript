name: e2e-cli-prod

on:
  workflow_run:
    workflows: ["publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      published-version:
        description: Published @netscript/cli version to validate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-cli-prod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold-runtime-jsr:
    name: scaffold-runtime (published JSR CLI)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          dotnet tool install Aspire.Cli --tool-path "$HOME/.aspire/bin" --version 13.5.3
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Aspire CLI preflight
        run: |
          aspire_version="$(aspire --version)"
          echo "$aspire_version"
          case "$aspire_version" in
            13.5.*) ;;
            *) echo "Expected Aspire CLI 13.5.x, got $aspire_version" >&2; exit 1 ;;
          esac
          aspire doctor --non-interactive --nologo

      - name: Download published version
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: netscript-published-version-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .llm/tmp/published-version

      - name: Resolve published version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs['published-version'] }}
          VERSION_FILE: .llm/tmp/published-version/version.txt
        run: |
          version="${DISPATCH_VERSION:-}"
          if [ -z "$version" ] && [ -f "$VERSION_FILE" ]; then
            version="$(cat "$VERSION_FILE")"
          fi
          if [ -z "$version" ]; then
            echo "A published version is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for JSR propagation
        run: |
          echo "sleeping 120s so just-published @netscript/cli@${{ steps.version.outputs.version }} and deps become resolvable on JSR before install."
          sleep 120

      - name: Install workspace dependencies
        id: install_workspace_dependencies
        run: deno install

      # The README owns the first application/runtime on this fresh hosted VM.
      # Do not restore an AppHost cache or run another scaffold before this gate.
      - name: Verify cold README baseline
        run: |
          set -euo pipefail
          mkdir -p .llm/tmp
          readme_apphosts="$(aspire ps --format Json | jq 'length')"
          readme_containers="$(docker ps -aq | wc -l)"
          readme_images="$(docker image ls -q | wc -l)"
          readme_volumes="$(docker volume ls -q | wc -l)"
          readme_networks="$(docker network ls --filter type=custom -q | wc -l)"
          jq -n \
            --argjson appHosts "$readme_apphosts" \
            --argjson containers "$readme_containers" \
            --argjson images "$readme_images" \
            --argjson volumes "$readme_volumes" \
            --argjson networks "$readme_networks" \
            '{appHosts: $appHosts, containers: $containers, images: $images, volumes: $volumes, networks: $networks}' \
            > .llm/tmp/readme-cold-baseline.json
          # This hosted PostgreSQL scenario needs fresh application state, not empty image caches.
          # Image count is diagnostic only; Docker is not a universal framework prerequisite.
          jq -e '[.appHosts, .containers, .volumes, .networks] | all(. == 0)' .llm/tmp/readme-cold-baseline.json
          test ! -e .llm/tmp/cli-e2e/my-app

      - name: Root README Quickstart E2E (published CLI, verbatim)
        run: |
          deno task e2e:cli run readme.quickstart \
            --source jsr \
            --cli "jsr:@netscript/cli@${{ steps.version.outputs.version }}" \
            --cleanup \
            --report .llm/tmp/readme-quickstart-prod-report.json \
            --log-file .llm/tmp/readme-quickstart-prod.ndjson

      - name: Install published CLI from JSR
        id: install_published_cli
        run: |
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno install -g -A --minimum-dependency-age=0 -n netscript "jsr:@netscript/cli@${{ steps.version.outputs.version }}"
          netscript --help

      - name: Public init smoke from JSR CLI
        run: |
          rm -rf .llm/tmp/cli-prod-init-smoke
          netscript init cli-prod-init-smoke \
            --path .llm/tmp \
            --ci \
            --yes \
            --no-git \
            --no-aspire \
            --force
          test -f .llm/tmp/cli-prod-init-smoke/deno.json

      - name: Full scaffold runtime E2E (published CLI, one pass)
        run: |
          deno task e2e:cli run scaffold.runtime \
            --source jsr \
            --cli "jsr:@netscript/cli@${{ steps.version.outputs.version }}" \
            --cleanup \
            --format pretty \
            --report .llm/tmp/cli-e2e-prod-report.json \
            --log-file .llm/tmp/cli-e2e-prod.ndjson

      - name: Quickstart walk E2E (published CLI, seven verdicts)
        if: ${{ always() && steps.install_published_cli.outcome == 'success' && steps.install_workspace_dependencies.outcome == 'success' }}
        run: |
          deno task e2e:cli run quickstart.walk \
            --source jsr \
            --cli "jsr:@netscript/cli@${{ steps.version.outputs.version }}" \
            --cleanup \
            --format pretty \
            --report .llm/tmp/quickstart-walk-prod-report.json \
            --log-file .llm/tmp/quickstart-walk-prod.ndjson

      - name: Report production E2E failure
        if: failure()
        run: |
          found=false
          for report in .llm/tmp/cli-e2e-prod-report.json .llm/tmp/quickstart-walk-prod-report.json .llm/tmp/readme-quickstart-prod-report.json; do
            if [ -f "$report" ]; then
              found=true
              deno run --allow-read --allow-env=GITHUB_STEP_SUMMARY --allow-write="$GITHUB_STEP_SUMMARY" \
                .llm/tools/e2e/print-failed-report-steps.ts --github "$report" || true
            fi
          done
          if [ "$found" = false ]; then
            message="Production CLI E2E failed for @netscript/cli@${{ steps.version.outputs.version }}; no JSON report was produced."
            echo "::error::$message"
            printf '## Production CLI E2E failure\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production E2E artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-cli-prod-${{ steps.version.outputs.version }}
          path: |
            .llm/tmp/cli-e2e-prod-report.json
            .llm/tmp/cli-e2e-prod.ndjson
            .llm/tmp/quickstart-walk-prod-report.json
            .llm/tmp/quickstart-walk-prod.ndjson
            .llm/tmp/readme-quickstart-prod-report.json
            .llm/tmp/readme-quickstart-prod.ndjson
            .llm/tmp/readme-cold-baseline.json
            .llm/tmp/readme-quickstart/state.json
            .llm/tmp/readme-quickstart/receipts/*.json
            .llm/tmp/gate-receipts/readme.quickstart/cleanup.aspire-stop.receipt.json
            .llm/tmp/gate-receipts/readme.quickstart/cleanup.aspire-stop.json
            ~/.aspire/logs/cli_*.log
          if-no-files-found: ignore
