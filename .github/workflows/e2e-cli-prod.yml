name: e2e-cli-prod

on:
  workflow_run:
    workflows: ["publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      published-version:
        description: Published @netscript/cli version to validate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-cli-prod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-aspire-sdk-cache:
    name: prepare pinned Aspire SDK cache
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore pinned Aspire SDK cache
        id: aspire-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-aspire-${{ runner.os }}-13.4.6-v2

      - name: Populate exact Aspire SDK packages
        if: steps.aspire-sdk-cache.outputs.cache-hit != 'true'
        run: >-
          dotnet restore .github/aspire-cache/AspireSdkCache.csproj
          --packages "$HOME/.nuget/packages"
          --source https://api.nuget.org/v3/index.json
          --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet9/nuget/v3/index.json

      - name: Verify exact Aspire SDK packages
        run: |
          test -f "$HOME/.nuget/packages/aspire.hosting/13.4.6/aspire.hosting.13.4.6.nupkg"
          test -f "$HOME/.nuget/packages/aspire.hosting.postgresql/13.4.6/aspire.hosting.postgresql.13.4.6.nupkg"
          test -f "$HOME/.nuget/packages/aspire.hosting.redis/13.4.6/aspire.hosting.redis.13.4.6.nupkg"
          test -f "$HOME/.nuget/packages/aspire.hosting.browsers/13.4.6-preview.1.26319.6/aspire.hosting.browsers.13.4.6-preview.1.26319.6.nupkg"
          test -f "$HOME/.nuget/packages/aspire.hosting.codegeneration.typescript/13.4.6/aspire.hosting.codegeneration.typescript.13.4.6.nupkg"

  scaffold-runtime-jsr:
    name: scaffold-runtime (published JSR CLI)
    needs: prepare-aspire-sdk-cache
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore pinned Aspire NuGet package cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-aspire-${{ runner.os }}-13.4.6-v2

      - name: Install Aspire CLI
        env:
          ASPIRE_CLI_VERSION: '13.4.6'
        run: |
          dotnet tool install Aspire.Cli --tool-path "$HOME/.aspire/bin" --version "$ASPIRE_CLI_VERSION"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Download published version
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: netscript-published-version-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .llm/tmp/published-version

      - name: Resolve published version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs['published-version'] }}
          VERSION_FILE: .llm/tmp/published-version/version.txt
        run: |
          version="${DISPATCH_VERSION:-}"
          if [ -z "$version" ] && [ -f "$VERSION_FILE" ]; then
            version="$(cat "$VERSION_FILE")"
          fi
          if [ -z "$version" ]; then
            echo "A published version is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for JSR propagation
        run: |
          echo "sleeping 120s so just-published @netscript/cli@${{ steps.version.outputs.version }} and deps become resolvable on JSR before install."
          sleep 120

      - name: Install published CLI from JSR
        id: install_published_cli
        run: |
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno install -g -A --minimum-dependency-age=0 -n netscript "jsr:@netscript/cli@${{ steps.version.outputs.version }}"
          netscript --help

      - name: Install workspace dependencies
        id: install_workspace_dependencies
        run: deno install

      - name: Public init smoke from JSR CLI
        run: |
          rm -rf .llm/tmp/cli-prod-init-smoke
          netscript init cli-prod-init-smoke \
            --path .llm/tmp \
            --ci \
            --yes \
            --no-git \
            --no-aspire \
            --force
          test -f .llm/tmp/cli-prod-init-smoke/deno.json

      - name: Full scaffold runtime E2E (published CLI, one pass)
        run: |
          deno task e2e:cli run scaffold.runtime \
            --source jsr \
            --cli "jsr:@netscript/cli@${{ steps.version.outputs.version }}" \
            --cleanup \
            --format pretty \
            --report .llm/tmp/cli-e2e-prod-report.json \
            --log-file .llm/tmp/cli-e2e-prod.ndjson

      - name: Quickstart walk E2E (published CLI, seven verdicts)
        if: ${{ always() && steps.install_published_cli.outcome == 'success' && steps.install_workspace_dependencies.outcome == 'success' }}
        run: |
          deno task e2e:cli run quickstart.walk \
            --source jsr \
            --cli "jsr:@netscript/cli@${{ steps.version.outputs.version }}" \
            --cleanup \
            --format pretty \
            --report .llm/tmp/quickstart-walk-prod-report.json \
            --log-file .llm/tmp/quickstart-walk-prod.ndjson

      - name: Report production E2E failure
        if: failure()
        run: |
          found=false
          for report in .llm/tmp/cli-e2e-prod-report.json .llm/tmp/quickstart-walk-prod-report.json; do
            if [ -f "$report" ]; then
              found=true
              deno run --allow-read --allow-env=GITHUB_STEP_SUMMARY --allow-write="$GITHUB_STEP_SUMMARY" \
                .llm/tools/e2e/print-failed-report-steps.ts --github "$report" || true
            fi
          done
          if [ "$found" = false ]; then
            message="Production CLI E2E failed for @netscript/cli@${{ steps.version.outputs.version }}; no JSON report was produced."
            echo "::error::$message"
            printf '## Production CLI E2E failure\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production E2E artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-cli-prod-${{ steps.version.outputs.version }}
          path: |
            .llm/tmp/cli-e2e-prod-report.json
            .llm/tmp/cli-e2e-prod.ndjson
            .llm/tmp/quickstart-walk-prod-report.json
            .llm/tmp/quickstart-walk-prod.ndjson
            ~/.aspire/logs/cli_*.log
          if-no-files-found: ignore
