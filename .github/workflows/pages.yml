name: Deploy docs site to Pages

on:
  pull_request:
    branches: [main]
    paths:
      - docs/site/**
      - docs/design-system/**
      - tools/docs-site/**
      - tools/fresh-ui-browser/docs.playwright.config.ts
      - tools/fresh-ui-browser/docs.deno.json
      - tools/fresh-ui-browser/docs-tests/**
      - tools/fresh-ui-browser/package.json
      - tools/fresh-ui-browser/package-lock.json
      - packages/**
      - '!packages/**/tests/**'
      - '!packages/cli/e2e/**'
      - '!packages/**/*_test.ts'
      - '!packages/**/*.test.ts'
      - plugins/**
      - '!plugins/**/tests/**'
      - '!plugins/**/*_test.ts'
      - '!plugins/**/*.test.ts'
      - .llm/tools/docs/**
      - deno.json
      - deno.lock
      - .github/scripts/ci-classify-changes.ts
      - .github/scripts/ci-classify-changes.test.ts
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - docs/site/**
      - docs/design-system/**
      - tools/docs-site/**
      - tools/fresh-ui-browser/docs.playwright.config.ts
      - tools/fresh-ui-browser/docs.deno.json
      - tools/fresh-ui-browser/docs-tests/**
      - tools/fresh-ui-browser/package.json
      - tools/fresh-ui-browser/package-lock.json
      - packages/**
      - '!packages/**/tests/**'
      - '!packages/cli/e2e/**'
      - '!packages/**/*_test.ts'
      - '!packages/**/*.test.ts'
      - plugins/**
      - '!plugins/**/tests/**'
      - '!plugins/**/*_test.ts'
      - '!plugins/**/*.test.ts'
      - .llm/tools/docs/**
      - deno.json
      - deno.lock
      - .github/scripts/ci-classify-changes.ts
      - .github/scripts/ci-classify-changes.test.ts
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Queue policy: every non-PR event, including ordinary pushes to main, resolves
# to the repo-wide `pages-deploy` group because one site is a global resource.
# `cancel-in-progress: false` protects the RUNNING deployment but, by itself,
# leaves only one PENDING slot; a third arrival evicts that pending job, whose
# `cancelled` conclusion and zero executed steps distinguish queue eviction from
# mid-execution cancellation. Retain every arrival for serial execution.
# This guarantee applies only to arrivals carrying this workflow revision:
# dispatches from stale branches use that ref's older queue policy and can still
# displace a pending `pages-deploy` entry until those branch copies converge.
#
# The deploy job's `github-pages` environment applies deployment protections;
# GitHub environments and concurrency groups are independent, so it does not
# replace this workflow-level mutex over classify, build, and deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    name: classify docs-site changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      diff_unavailable: ${{ steps.diff.outputs.diff_unavailable }}
      needs_pages: ${{ steps.decide.outputs.needs_pages }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Self-check the classifier
        run: >-
          deno test --allow-read --allow-write --allow-env
          .github/scripts/ci-classify-changes.test.ts
      - name: Compute changed files
        id: diff
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_NAME_STATUS_FILE: ${{ runner.temp }}/changed-name-status.txt
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          # PRs compare from their merge base; pushes compare the complete before/after trees.
          separator='..'
          if [ "$EVENT_NAME" = 'pull_request' ]; then separator='...'; fi
          if ! git diff --name-status -M "${BASE_SHA}${separator}${HEAD_SHA}" > "$CHANGED_NAME_STATUS_FILE" 2> "$error_file"; then
            cat "$error_file" >&2
            echo "diff_unavailable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "diff_unavailable=false"
          } >> "$GITHUB_OUTPUT"
      - name: Extract root deno.json
        id: rootcfg
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && steps.diff.outputs.diff_unavailable != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "base<<__CFG_EOF__"
            git show "$BASE_SHA:deno.json" 2>/dev/null || true
            echo "__CFG_EOF__"
            echo "head<<__CFG_EOF__"
            git show "$HEAD_SHA:deno.json" 2>/dev/null || true
            echo "__CFG_EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Decide run or skip
        id: decide
        if: (github.event_name != 'pull_request' && github.event_name != 'push') || steps.diff.outputs.diff_unavailable != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_PUSH_DIFF: ${{ github.event_name == 'push' && steps.diff.outputs.diff_unavailable == 'false' }}
          CHANGED_NAME_STATUS_FILE: ${{ runner.temp }}/changed-name-status.txt
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ROOT_DENO_JSON_BASE: ${{ steps.rootcfg.outputs.base }}
          ROOT_DENO_JSON_HEAD: ${{ steps.rootcfg.outputs.head }}
        run: deno run --allow-read --allow-write --allow-env .github/scripts/ci-classify-changes.ts

  build:
    needs: classify
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN: ${{ needs.classify.result != 'success' || needs.classify.outputs.needs_pages != 'false' }}
      SKIP_REASON: ${{ needs.classify.outputs.reason }}
    steps:
      - name: Skipped by policy
        if: env.RUN != 'true'
        run: printf '::notice::Pages build skipped by policy. %s\n' "$SKIP_REASON"
      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@v5
      - name: Setup Deno
        if: env.RUN == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Check documentation exports drift
        if: env.RUN == 'true'
        run: deno task docs:exports-drift
      - name: Check documentation snippets
        if: env.RUN == 'true'
        timeout-minutes: 5
        run: deno task docs:snippets
      - name: Build Lume site
        if: env.RUN == 'true'
        working-directory: docs/site
        run: deno task build
      - name: Check internal links
        if: env.RUN == 'true'
        working-directory: docs/site
        run: deno task check:links
      - name: Check caveat references
        if: env.RUN == 'true'
        working-directory: docs/site
        run: deno task check:caveats
      - name: Configure Pages
        if: env.RUN == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: env.RUN == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/_site

  deploy:
    if: github.event_name != 'pull_request' && !cancelled() && needs.build.result == 'success' && needs.utility-browser.result == 'success' && needs.classify.outputs.needs_pages != 'false'
    needs: [classify, build, utility-browser]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  utility-browser:
    name: Utility docs browser and style policy
    needs: classify
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.needs_pages != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/fresh-ui-browser/package-lock.json
      - name: Verify generated Utility values without repairing them
        run: deno run --allow-read tools/docs-site/generate-tokens.ts --check
      - name: Check docs tooling
        run: |
          deno run --allow-read --allow-run .llm/tools/run-deno-check.ts --root tools/docs-site --ext ts
          deno run --allow-read --allow-run .llm/tools/run-deno-lint.ts --root tools/docs-site --ext ts --config docs/site/deno.json
          deno run --allow-read --allow-run .llm/tools/run-deno-fmt.ts --root tools/docs-site --ext ts
          deno run --allow-read --allow-write --allow-run .llm/tools/run-deno-test.ts -- --allow-read tools/docs-site/generate-tokens_test.ts tools/docs-site/inline-diagram_test.ts tools/docs-site/navigation_test.ts tools/docs-site/code-languages_test.ts tools/docs-site/api-kinds_test.ts tools/docs-site/syntax-contrast_test.ts
      - name: Reproduce rendered docs, twins and anchor fragments before browser verification
        run: deno run --allow-read --allow-run --allow-env tools/docs-site/check-reproducible.ts --allow-pagefind-metadata
      - name: Install locked browser tooling
        working-directory: tools/fresh-ui-browser
        run: npm ci --ignore-scripts
      - name: Check browser test TypeScript
        run: |
          deno run --allow-read --allow-run .llm/tools/run-deno-check.ts --cwd tools/fresh-ui-browser --root docs-tests --file docs.playwright.config.ts --ext ts --deno-arg --config --deno-arg docs.deno.json
          deno run --allow-read --allow-run .llm/tools/run-deno-lint.ts --cwd tools/fresh-ui-browser --root docs-tests --file docs.playwright.config.ts --ext ts --config ../../docs/site/deno.json
          deno run --allow-read --allow-run .llm/tools/run-deno-fmt.ts --cwd tools/fresh-ui-browser --root docs-tests --file docs.playwright.config.ts --ext ts --config ../../docs/site/deno.json
      - name: Install Chromium and system dependencies
        working-directory: tools/fresh-ui-browser
        run: npx playwright install --with-deps chromium
      - name: Screenshots, strict axe, keyboard and policy negative contracts
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          .llm/tools/gates/run-gate.ts --gate fresh-ui-browser --id docs-utility-browser
          --cwd tools/fresh-ui-browser
          --output .llm/tmp/gate-receipts/docs-utility-browser/browser.receipt.json
          --child-report test-results/docs/results.json --
          -- --config docs.playwright.config.ts
      - name: Upload Utility screenshots, axe, traces and command receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: docs-utility-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/fresh-ui-browser/test-results/docs/
            tools/fresh-ui-browser/playwright-report/docs/
            .llm/tmp/gate-receipts/docs-utility-browser/
          if-no-files-found: error
          retention-days: 30
